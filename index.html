<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcaea B30 Viewer</title>
<style>
/* @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&family=Rajdhani:wght@400;500;600;700&display=swap'); */
@font-face {
  font-family: 'Exo-Regular';
  src: url('./src/Fonts/Exo-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'GeosansLight';
  src: url('./src/Fonts/GeosansLight.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'L2-Regular';
  src: url('./src/Fonts/L2-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg:      #0b0c18;
  --bg2:     #10121f;
  --bg3:     #14162a;
  --surface: #181b2e;
  --surf2:   #1e2238;
  --border:  #272b48;
  --border2: #323660;
  --accent:  #c8a0ff;
  --accent2: #80c4ff;
  --gold:    #ffd580;
  --green:   #6bffb8;
  --red:     #ff6b8a;
  --text:    #eae8ff;
  --text2:   #9896c8;
  --text3:   #525080;
  --pm_color:    #2580A0;
  --fr_color:  #773481;
  --hc_color:  #C72F5B;
  --nc_color:  #774271;
  --tl_color:  #C34C6F;
  --p_color:   #C534A2;
  --f_color:   #EBB69D;
  --l_color:  #a94658;


  --byd:       #e84060;
  --byd-light: #ff7090;
  --byd-bg:    rgba(232,64,96,0.13);
  --ftr:       #a050f0;
  --ftr-light: #c080ff;
  --ftr-bg:    rgba(160,80,240,0.13);
  --etr:       #8A7AA5;
  --etr-light: #A592C6;
  --etr-bg:    rgba(64,160,232,0.12);
  --pst:       #50d890;
  --pst-light: #80ffb8;
  --pst-bg:    rgba(80,216,144,0.10);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'GeosansLight',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 5%,rgba(120,60,220,.10) 0%,transparent 55%),
    radial-gradient(ellipse 50% 70% at 85% 90%,rgba(50,90,200,.07) 0%,transparent 55%);
  pointer-events:none;z-index:0;
}

.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 48px;position:relative;z-index:1}

/* header */
.player-name{font-size:24px;font-weight:900;letter-spacing:.04em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ptt-pill{background:linear-gradient(135deg,#7030c8,#5020a0);border:1px solid #a060ff;border-radius:6px;padding:2px 10px 3px;font-size:13px;font-family:'Exo-Regular',sans-serif;font-weight:700;letter-spacing:.1em;color:#fff}
.stats-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.stat{font-family:'Exo-Regular',sans-serif;font-size:12px;color:var(--text3);letter-spacing:.06em}
.stat b{color:var(--accent);font-weight:700}

/* upload */
.upload-bar{display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--border2);border-radius:10px;padding:14px 18px;margin-bottom:20px;align-items:center}
.upload-group{display:flex;align-items:center;gap:8px;flex:1;min-width:200px}
.upload-tag{font-family:'Exo-Regular',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text3);white-space:nowrap}
.upload-btn{background:var(--surf2);border:1px solid var(--border2);border-radius:5px;color:var(--text2);padding:5px 12px;font-family:'Exo-Regular',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap}
.upload-btn:hover{border-color:var(--accent);color:var(--accent)}
input[type=file]{display:none}
.fstat{font-size:11px;color:var(--text3);font-family:'Exo-Regular',sans-serif}
.fstat.ok{color:var(--green)}
.img-path-input{background:var(--surf2);border:1px solid var(--border2);border-radius:5px;color:var(--text2);padding:5px 10px;font-family:'Exo-Regular',sans-serif;font-size:12px;outline:none;flex:1;transition:border-color .18s;min-width:120px}
.img-path-input:focus{border-color:var(--accent)}
.img-path-input::placeholder{color:var(--text3)}

/* chart */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px 16px;margin-bottom:20px;position:relative}
.sec-lbl{font-family:'Exo-Regular',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:12px}
#ratingChart{width:100%;height:190px;cursor:crosshair;display:block}
.c-tip{position:absolute;background:var(--bg3);border:1px solid rgba(200,160,255,.5);border-radius:8px;padding:8px 14px;font-family:'Exo-Regular',sans-serif;pointer-events:none;display:none;z-index:50;min-width:190px;box-shadow:0 6px 24px rgba(0,0,0,.55)}
.ct-date{font-size:11px;color:var(--text2);margin-bottom:3px}
.ct-ptt{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.ct-b30{font-size:11px;color:var(--text3);margin-top:2px}

/* b30 head */
.b30-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.b30-title{font-family:'Exo-Regular',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--text3);text-transform:uppercase}
.b30-date{font-family:'Exo-Regular',sans-serif;font-size:13px;font-weight:600;color:var(--accent2);letter-spacing:.04em}
.b30-avg{font-family:'Exo-Regular',sans-serif;font-size:13px;color:var(--text2)}
.b30-avg b{color:var(--accent)}

/* 3-column grid */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:760px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.cards-grid{grid-template-columns:1fr}}

/* card */
.song-card{
  border-radius:10px;
  border:1px solid var(--c-border,var(--border));
  overflow:hidden;
  display:flex;
  height:82px;
  position:relative;
  transition:border-color .18s,transform .14s;
  background:var(--surface);
}
.song-card:hover{transform:translateY(-1px);border-color:var(--c-main,var(--border2))}
/* left accent bar */
.song-card::after{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--c-main,var(--border2));
  border-radius:10px 0 0 10px;
}

/* cover */
.card-cover{
  width:82px;min-width:82px;height:82px;
  position:relative;flex-shrink:0;
  background:var(--surf2);
  display:flex;align-items:center;justify-content:center;
}
.card-cover img{width:82px;height:82px;object-fit:cover;display:block;position:absolute;inset:0}
.card-cover .no-img{
  font-size:24px;color:var(--c-main,var(--text3));opacity:.5;
  display:flex;align-items:center;justify-content:center;
  width:82px;height:82px;
}

/* body */
.card-body{flex:1;min-width:0;padding:7px 10px 7px 9px;display:flex;flex-direction:column;justify-content:space-between;position:relative}

.card-r1{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-rank-title {
  display: flex;
  align-items: center; 
  gap: 5px;
}
.card-no {
  font-family: 'Exo-Regular', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: .06em;
}
.card-title{font-family: 'L2-Regular', sans-serif;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* .card-diff{
  font-family:'Exo-Regular',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.1em;padding:1px 4px;border-radius:3px;
  background:var(--c-bg,var(--surf2));
  color:var(--c-main,var(--text2));
  border:1px solid color-mix(in srgb,var(--c-main,var(--border)) 50%,transparent);
} */
.card-ptt{
  font-family:'Exo-Regular',sans-serif;font-size:16px;font-weight:700;
  color:var(--c-main,var(--accent));letter-spacing:.02em;white-space:nowrap;
}


.card-r3{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-score{font-family:'Exo-Regular',sans-serif;font-size:23px;font-weight:600;color:var(--text2);letter-spacing:.04em}
.card-clear{
  position: absolute;
  left: 147px;          
  font-family: 'Exo-Regular', sans-serif;
  font-size: 22px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text3);
}
.card-const{
  font-family:'Exo-Regular',sans-serif;font-size:13px;font-weight:700;
  padding:1px 5px;border-radius:3px;
  background:var(--c-bg,var(--surf2));
  color:var(--c-main,var(--text2));
  white-space:nowrap;
}

.card-pfl{display:flex;gap:6px}
.pfl-item{font-family:'Exo-Regular',sans-serif;font-size:12px;color:var(--text3);letter-spacing:.02em}
.pfl-item b{color:var(--text2)}

.p-item{font-family:'Exo-Regular',sans-serif;font-size:12px;color:var(--p_color);letter-spacing:.02em}
.f-item{font-family:'Exo-Regular',sans-serif;font-size:12px;color:var(--f_color);letter-spacing:.02em}
.l-item{font-family:'Exo-Regular',sans-serif;font-size:12px;color:var(--l_color);letter-spacing:.02em}

.card-clear.pm{color:var(--pm_color)}
.card-clear.fr{color:var(--fr_color)}
/* .card-clear.nc{color:var(--nc_color)}
.card-clear.hc{color:var(--hc_color)}
.card-clear.tl{color:var(--tl_color)} */
.card-date{
  position:absolute;right:9px;bottom:4px;
  font-family:'Exo-Regular',sans-serif;font-size:12px;font-weight:700;
  text-transform:uppercase;color:var(--text3);
}
/* empty */
.empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text3);font-family:'Exo-Regular',sans-serif;font-size:14px;letter-spacing:.1em}
.ei{font-size:36px;margin-bottom:10px;opacity:.3}

/* ── modal overlay ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:28px 30px;min-width:300px;
  box-shadow:0 12px 48px rgba(0,0,0,.7);
}
.modal-box h3{
  font-family:'Exo-Regular',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:16px;
}
.modal-field{margin-bottom:14px}
.modal-field label{
  display:block;font-family:'Exo-Regular',sans-serif;font-size:11px;
  font-weight:700;letter-spacing:.1em;color:var(--text2);margin-bottom:6px;
}
.modal-field input{
  width:100%;background:var(--surf2);border:1px solid var(--border2);
  border-radius:6px;color:var(--text);padding:7px 12px;
  font-family:'Exo-Regular',sans-serif;font-size:14px;outline:none;
  transition:border-color .18s;
}
.modal-field input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-confirm{
  background:linear-gradient(135deg,#7030c8,#5020a0);
  border:none;border-radius:6px;color:#fff;
  padding:7px 18px;font-family:'Exo-Regular',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer;
  transition:opacity .18s;
}
.btn-confirm:hover{opacity:.85}
.btn-cancel{
  background:var(--surf2);border:1px solid var(--border2);
  border-radius:6px;color:var(--text2);
  padding:7px 14px;font-family:'Exo-Regular',sans-serif;
  font-size:13px;font-weight:600;cursor:pointer;transition:border-color .18s;
}
.btn-cancel:hover{border-color:var(--accent);color:var(--accent)}

/* chart bottom padding for labels */
#ratingChart{ height:210px !important; }

.settings-wrap{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;margin-bottom:20px;overflow:hidden;
}
.settings-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;cursor:pointer;user-select:none;
  font-family:'Exo-Regular',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.15em;color:var(--text3);text-transform:uppercase;
}
.settings-header:hover{color:var(--text2)}
.settings-header .chevron{
  font-size:10px;transition:transform .2s;display:inline-block;
}
.settings-header.open .chevron{transform:rotate(180deg)}
.settings-body{
  display:none;padding:12px 16px 16px;
  border-top:1px solid var(--border);
  display:none;gap:24px;flex-wrap:wrap;
}
.settings-body.open{display:flex}
.setting-item{
  display:flex;align-items:center;gap:10px;
}
.setting-label{
  font-family:'Exo-Regular',sans-serif;font-size:12px;
  font-weight:600;color:var(--text2);letter-spacing:.06em;
}
/* toggle switch */
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{
  position:absolute;inset:0;background:var(--surf2);
  border:1px solid var(--border2);border-radius:10px;
  transition:background .2s,border-color .2s;cursor:pointer;
}
.toggle input:checked+.toggle-track{background:var(--ftr);border-color:var(--ftr-light)}
.toggle-thumb{
  position:absolute;top:3px;left:3px;
  width:12px;height:12px;border-radius:50%;
  background:#fff;transition:transform .2s;pointer-events:none;
}
.toggle input:checked~.toggle-thumb{transform:translateX(16px)}
/* segmented control */
.seg-ctrl{
  display:flex;border:1px solid var(--border2);
  border-radius:6px;overflow:hidden;
}
.seg-ctrl label{
  font-family:'Exo-Regular',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.06em;padding:4px 10px;cursor:pointer;
  color:var(--text3);background:var(--surf2);
  transition:background .15s,color .15s;white-space:nowrap;
}
.seg-ctrl input{display:none}
.seg-ctrl input:checked+label{
  background:var(--ftr);color:#fff;
}
</style>
</head>
<body>
<!-- Profile modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-box">
    <h3>填写存档信息</h3>
    <div class="modal-field">
      <label>用户名</label>
      <input type="text" id="mName" placeholder="Player">
    </div>
    <div class="modal-field">
      <label>潜力值 (PTT)</label>
      <input type="text" id="mPtt" placeholder="13.00">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnModalCancel">取消</button>
      <button class="btn-confirm" id="btnModalOk">确认</button>
    </div>
  </div>
</div>
<div class="wrap">

  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px">
    <div class="player-name">
      <span id="pName">Arcaea B30</span>
      <span class="ptt-pill" id="pPtt">PTT —</span>
      <span class="ptt-pill" id="pMaxPtt" style="background:linear-gradient(135deg,#204080,#102860);border-color:#4080c0;display:none">Max —</span>
    </div>
    <button class="btn-cancel" id="btnProfile" style="align-self:center">
      ✎ 填写存档信息
    </button>
  </div>
  <div class="stats-row">
    <div class="stat">B30 Avg <b id="hAvg">—</b></div>
    <div class="stat">TOP10 Avg <b id="hT10">—</b></div>
    <div class="stat">期间 <b id="hRange">—</b></div>
  </div>

  <div class="upload-bar">
    <div class="upload-group">
      <div class="upload-tag">RATING</div>
      <label class="upload-btn" for="f1">选择 CSV</label>
      <input type="file" id="f1" accept=".csv">
      <div class="fstat" id="s1">未加载</div>
    </div>
    <div class="upload-group">
      <div class="upload-tag">PLAYS</div>
      <label class="upload-btn" for="f2">选择 CSV</label>
      <input type="file" id="f2" accept=".csv">
      <div class="fstat" id="s2">未加载</div>
    </div>
    <!-- <div class="upload-group" style="gap:6px">
      <div class="upload-tag">IMG</div>
      <input class="img-path-input" id="imgBase" type="text"
        placeholder="封面路径前缀，如 songs/">
    </div> -->
  </div>
    <div class="settings-wrap">
    <div class="settings-header" id="settingsHeader">
      ⚙ 显示设置 <span class="chevron">▼</span>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="setting-item">
        <div class="setting-label">显示 LS</div>
        <label class="toggle">
          <input type="checkbox" id="togLS" checked>
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
      <div class="setting-item">
        <div class="setting-label">MaxPure 样式</div>
        <div class="seg-ctrl">
          <input type="radio" name="mpStyle" id="mpPlus" value="plus" checked>
          <label for="mpPlus">(+maxPure)</label>
          <input type="radio" name="mpStyle" id="mpMinus" value="minus">
          <label for="mpMinus">(−pure−maxPure)</label>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">排行模式</div>
        <div class="seg-ctrl" id="filterCtrl">
          <input type="radio" name="rankFilter" id="rfB30"  value="b30"  checked>
          <label for="rfB30">B30</label>
          <input type="radio" name="rankFilter" id="rfP30"  value="p30">
          <label for="rfP30">P30</label>
          <input type="radio" name="rankFilter" id="rfLS0"  value="ls0">
          <label for="rfLS0">LS0·30</label>
          <input type="radio" name="rankFilter" id="rfMax"  value="max">
          <label for="rfMax">MAX·30</label>
        </div>
      </div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="sec-lbl">RATING HISTORY — 悬停查看当时 B30 · 移出后保持显示</div>
    <canvas id="ratingChart"></canvas>
    <div class="c-tip" id="cTip">
      <div class="ct-date" id="tipDate"></div>
      <div class="ct-ptt"  id="tipPtt"></div>
      <div class="ct-b30"  id="tipB30"></div>
    </div>
  </div>

  <div class="b30-head">
    <div class="b30-title" id="b30Title">BEST 30</div>
    <div class="b30-date" id="b30DL"></div>
    <div class="b30-avg">Max <b id="b30mx">—</b></div>
    <div class="b30-avg">B30 Avg <b id="b30AL">—</b></div>
    <div class="b30-avg">TOP10 Avg <b id="b30T10">—</b></div>
  </div>
  <div class="cards-grid" id="grid">
    <div class="empty-state"><div class="ei">♪</div>请上传 CSV 文件后查看</div>
  </div>

</div>

<script>
// ── state ────────────────────────────────────────
let ratingHistory=[], playHistory=[];
let chartData=[];
let hoverIdx=-1;
let shownB30=[], shownDate='';   // what's currently displayed (persist on mouseout)
let songMap = {};  // id -> title_en
let userPttSet = false;  // 用户是否手动设置过PTT
// ── filters ──────────────────────────────────────
const FILTERS = {
  b30:  null,                                           // 无过滤，取全部最佳
  p30:  p => p.far === 0 && p.lost === 0,               // Pure Memory 候选
  ls0:  p => p.ls === 0,                                // LS 为 0
  max:  p => p.pure === p.maxPure,                      // Pure == MaxPure
};

const FILTER_LABELS = {
  b30: 'B30', p30: 'P30', ls0: 'LS0·30', max: 'MAX·30',
};

let settings = {
  filter: 'b30',        // 当前选中的 filter key
  showLS: true,
  maxPureStyle: 'plus', // 'plus' | 'minus'
};
// ── utils ────────────────────────────────────────
const toMs = t => t < 1e12 ? t*1000 : t;

function parseDateStr(s){
  if(!s) return null;
  const m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
  return isNaN(d.getTime())?null:d.getTime();
}

function calculateDaysSince(ts) {
  if (!ts) return '—';
  const past = new Date(ts);
  const now = new Date();
  // 计算时间差（毫秒），然后转换为天数
  const diffTime = Math.abs(now - past);
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
  return diffDays;
}

function fmtScore(n){
  const s=String(n).padStart(8,'0');
  return s.replace(/(\d{2})(\d{3})(\d{3})/,"$1'$2'$3");
}

function diffName(d){return['PST','PRS','FTR','BYD','ETR'][d]??'FTR'}

function diffStyle(d){
  if(d===4) return {main:'var(--etr)',bg:'var(--etr-bg)',border:'rgba(64,160,232,.35)'};
  if(d===3) return {main:'var(--byd)',bg:'var(--byd-bg)',border:'rgba(232,64,96,.35)'};
  if(d===2) return {main:'var(--ftr)',bg:'var(--ftr-bg)',border:'rgba(160,80,240,.35)'};
  return           {main:'var(--pst)',bg:'var(--pst-bg)',border:'rgba(80,216,144,.30)'};
}

function clearCls(ct){
  if(ct===5) return {lbl:'HC',cls:'hc'};
  if(ct===4) return {lbl:'EC',cls:'ec'};
  if(ct===3) return {lbl:'PM',cls:'pm'};
  if(ct===2) return {lbl:'FR',cls:'fr'};
  if(ct===1) return {lbl:'NC',cls:'nc'};
  if(ct===0) return {lbl:'TL',cls:'tl'};
  return {lbl:'',cls:''};
}

// ── CSV ──────────────────────────────────────────
function parseRatingCSV(txt){
  return txt.trim().split('\n').slice(1).map(l=>{
    const p=l.split(',');
    if(p.length<3) return null;
    const ts=toMs(parseInt(p[0].trim()));
    const dateStr=p[1].trim().slice(1, -1);
    const rating=parseFloat(p[2].trim());
    return isNaN(ts)||isNaN(rating)?null:{ts,dateStr,rating};
  }).filter(Boolean).sort((a,b)=>a.ts-b.ts);
}

function parsePlayCSV(txt){
  return txt.trim().split('\n').slice(1).map(l=>{
    // 处理带引号的字段（DateTime列有引号）
    const p=l.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g)||l.split(',');
    const clean=p.map(x=>x.replace(/^"|"$/g,'').trim());
    if(clean.length<12) return null;
    // SongId,Difficulty,Score,Constant,Potential,LS,MaxPure,Pure,Far,Lost,ClearType,Timestamp,DateTime
    const ts=toMs(parseInt(clean[11]));
    const constant=parseFloat(clean[3]);
    const potential=parseFloat(clean[4]);
    const score=parseInt(clean[2]);
    if(isNaN(ts)||isNaN(constant)||isNaN(potential)) return null;
    return{
      songId:clean[0],
      diff:parseInt(clean[1]||'0'),
      score,constant,potential,
      ls:parseFloat(clean[5])||0,
      maxPure:parseInt(clean[6])||0,
      pure:parseInt(clean[7])||0,
      far:parseInt(clean[8])||0,
      lost:parseInt(clean[9])||0,
      clearType:parseInt(clean[10])||0,
      ts,
      dateStr:clean[12]||'',
    };
  }).filter(Boolean);
}

// ── B30 calc ─────────────────────────────────────
function calcBest30(ts, filter=null){
  const EPSILON=0.000001;
  const best=new Map();
  for(const p of playHistory){
    if(p.ts>ts) continue;
    const k=p.songId+'_'+p.diff;
    const existing=best.get(k);
    if(!existing||
       p.potential>existing.potential+EPSILON||
       (Math.abs(p.potential-existing.potential)<=EPSILON&&p.score>existing.score)){
      best.set(k,p);
    }
  }
  // filter 在选出每首最佳成绩之后再应用
  const all=[...best.values()]
    .filter(p=>filter?filter(p):true)
    .sort((a,b)=>{
      const d=b.potential-a.potential;
      return Math.abs(d)>EPSILON?d:b.score-a.score;
    });
  const top=all.slice(0,30);
  const avg=top.length?top.reduce((s,x)=>s+x.potential,0)/top.length:0;
  const top10=top.slice(0,10);
  const t10avg=top10.length?top10.reduce((s,x)=>s+x.potential,0)/top10.length:0;
  return{b30:top,avg,t10avg,total:all.length};
}

// 便捷包装：用当前 settings.filter
function calcB30(ts){
  return calcBest30(ts, FILTERS[settings.filter]);
}

// ── render ───────────────────────────────────────
function renderCards(b30,dateLabel){
  shownB30=b30; shownDate=dateLabel;
  document.getElementById('b30Title').textContent=FILTER_LABELS[settings.filter]||'BEST 30';
  document.getElementById('b30DL').textContent=dateLabel||'';
  if(b30.length){
    const avg=b30.reduce((s,x)=>s+x.potential,0)/b30.length;
    const t10=b30.slice(0,10).reduce((s,x)=>s+x.potential,0)/Math.min(10,b30.length);
    const mxptt=(avg*3+t10)/4;
    document.getElementById('b30AL').textContent=avg.toFixed(4);
    document.getElementById('b30T10').textContent=t10.toFixed(4);
    document.getElementById('b30mx').textContent=mxptt.toFixed(4);
  } else {
    document.getElementById('b30AL').textContent='—';
    document.getElementById('b30T10').textContent='—';
    document.getElementById('b30mx').textContent='-';
  }

  const grid=document.getElementById('grid');
  if(!b30.length){
    grid.innerHTML='<div class="empty-state"><div class="ei">♪</div>此时间点无记录</div>';
    return;
  }

  grid.innerHTML=b30.map((p,i)=>{
    const ds=diffStyle(p.diff);
    const cl=clearCls(p.clearType);
    return`
<div class="song-card"
  style="--c-main:${ds.main};--c-bg:${ds.bg};--c-border:${ds.border}">

  <div class="card-cover">
    <div class="no-img">♪</div>
      <img src="${imgSrc(p.songId,p.diff)}" alt=""
        data-fallback="./src/songs/${p.songId}/base_256.jpg"
        onload="this.previousElementSibling.style.display='none'"
        onerror="
          if(!this.dataset.tried){
            this.dataset.tried='1';
            this.src=this.dataset.fallback;
          } else {
            this.style.display='none';
          }
        ">
  </div>

  <div class="card-body">
    <div class="card-r1">
      <div class="card-rank-title">
        <div class="card-no">#${i+1}</div>
        <div class="card-title" title="${songTitle(p.songId)}">${songTitle(p.songId)}</div>
      </div>
      <div class="card-ptt">${p.potential.toFixed(4)}</div>
    </div>
    
    <div class="card-r3">
      <div class="card-score">${fmtScore(p.score)}</div>
      ${cl.lbl?`<div class="card-clear ${cl.cls}">${cl.lbl}</div>`:''}
      <div class="card-const">${p.constant.toFixed(1)}</div>
    </div>
    <div class="card-pfl">
      <div class="p-item">P/<b>${p.pure}</b>${
        settings.maxPureStyle==='plus'
          ? ` (+<b>${p.maxPure}</b>)`
          : ` (-<b>${p.pure-p.maxPure}</b>)`
      }</div>
      <div class="f-item">F/<b>${p.far}</b></div>
      <div class="l-item">L/<b>${p.lost}</b></div>
      ${settings.showLS ? `<div class="pfl-item" style="color:var(--accent2)">LS/<b style="color:var(--accent2)">${p.ls.toFixed(1)}</b></div>` : ''}
    </div>
    <div class="card-date">${calculateDaysSince(p.ts)}d</div>
  </div>
</div>`;
  }).join('');
}

  const{b30,avg,t10avg}=calcB30(Date.now());

  document.getElementById('hAvg').textContent=avg.toFixed(4);
  document.getElementById('hT10').textContent=t10avg.toFixed(4);
  if(ratingHistory.length){
    const maxPtt=ratingHistory[ratingHistory.length-1].rating.toFixed(2);

      document.getElementById('pPtt').textContent='PTT '+maxPtt;

      document.getElementById('pMaxPtt').textContent='Max '+maxPtt;

}

// ── chart ────────────────────────────────────────
const canvas=document.getElementById('ratingChart');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  const cssW=canvas.parentElement.clientWidth-44;
  const cssH=210;
  // CSS 尺寸
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
  // 实际像素尺寸
  canvas.width=Math.round(cssW*dpr);
  canvas.height=Math.round(cssH*dpr);
  
  drawChart();
}

function drawChart(){
  const dpr=window.devicePixelRatio||1;
  const W=parseInt(canvas.style.width||canvas.width);   
  const H=parseInt(canvas.style.height||canvas.height); 
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!chartData.length){
    ctx.fillStyle='#3a3858';ctx.font='12px Exo-Regular,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('上传 Rating History CSV 后显示折线图',W/2,H/2);
    return;
  }
  const P={t:14,r:14,b:42,l:54};
  const CW=W-P.l-P.r, CH=H-P.t-P.b;
  const vals=chartData.map(d=>d.rating);
  const mn=Math.min(...vals)-.08, mx=Math.max(...vals)+.08;
  const xOf=i=>P.l+(i/(chartData.length-1||1))*CW;
  const yOf=v=>P.t+(1-(v-mn)/(mx-mn))*CH;

  // grid
  for(let g=0;g<=4;g++){
    const v=mn+(mx-mn)*g/4, y=yOf(v);
    ctx.strokeStyle='#1e2238';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#8886b8';ctx.font='bold 11px Exo-Regular,sans-serif';ctx.textAlign='right';
    ctx.fillText(v.toFixed(2),P.l-6,y+4);
  }
  // fill
  const gr=ctx.createLinearGradient(0,P.t,0,H-P.b);
  gr.addColorStop(0,'rgba(160,80,240,.28)');gr.addColorStop(1,'rgba(160,80,240,0)');
  ctx.beginPath();
  ctx.moveTo(xOf(0),yOf(chartData[0].rating));
  for(let i=1;i<chartData.length;i++) ctx.lineTo(xOf(i),yOf(chartData[i].rating));
  ctx.lineTo(xOf(chartData.length-1),H-P.b);ctx.lineTo(xOf(0),H-P.b);
  ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  // line
  ctx.beginPath();
  ctx.moveTo(xOf(0),yOf(chartData[0].rating));
  for(let i=1;i<chartData.length;i++) ctx.lineTo(xOf(i),yOf(chartData[i].rating));
  ctx.strokeStyle='#b070ff';ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();
  // hover
  if(hoverIdx>=0&&hoverIdx<chartData.length){
    const hx=xOf(hoverIdx),hy=yOf(chartData[hoverIdx].rating);
    ctx.beginPath();ctx.moveTo(hx,P.t);ctx.lineTo(hx,H-P.b);
    ctx.strokeStyle='rgba(180,120,255,.25)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(hx,hy,5,0,Math.PI*2);
    ctx.fillStyle='#c080ff';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();
  }
  // x labels
  const step=Math.max(1,Math.floor(chartData.length/6));
  ctx.fillStyle='#9896c8';ctx.font='bold 11px Exo-Regular,sans-serif';ctx.textAlign='center';ctx.setLineDash([]);
  // draw small tick
  for(let i=0;i<chartData.length;i+=step){
    const x=xOf(i);
    ctx.strokeStyle='#3a3860';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,H-P.b);ctx.lineTo(x,H-P.b+4);ctx.stroke();
    // wrap long date: split "2024/7/2" → two lines if needed
    const parts=chartData[i].dateStr.split(' ');
    ctx.fillText(parts[0],x,H-P.b+16);
    if(parts[1]) ctx.fillText(parts[1],x,H-P.b+28);
  }
}

canvas.addEventListener('mousemove',throttle(function(e){
  if(!chartData.length) return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;   
  const PL=50,PR=14;
  const cssW=parseInt(canvas.style.width||canvas.width);  
  const norm=(mx-PL)/(cssW-PL-PR);
  hoverIdx=Math.max(0,Math.min(chartData.length-1,Math.round(norm*(chartData.length-1))));
  drawChart();

  const d=chartData[hoverIdx];
  const hTs=parseDateStr(d.dateStr)||d.ts;
  const{b30,avg,t10avg}=calcB30(hTs);

  const tip=document.getElementById('cTip');
  document.getElementById('tipDate').textContent=d.dateStr;
  document.getElementById('tipPtt').textContent='PTT '+d.rating.toFixed(2);
  document.getElementById('tipB30').textContent=
    `B30 ${avg.toFixed(4)}  ·  T10 ${t10avg.toFixed(4)}  ·  ${b30.length} 曲`;
  tip.style.display='block';
  let tx=e.clientX-rect.left+14;
  let ty=e.clientY-rect.top-10;
  if(tx+210>rect.width) tx-=220;
  if(ty<0) ty=4;
  tip.style.left=tx+'px';tip.style.top=ty+'px';

  // update cards — this becomes the new "last shown"
  renderCards(b30,d.dateStr);
}, 32));
function throttle(fn, ms){
  let last=0;
  return function(...args){
    const now=Date.now();
    if(now-last<ms) return;
    last=now;
    fn.apply(this,args);
  };
}
canvas.addEventListener('mouseleave',function(){
  hoverIdx=-1;
  drawChart();
  document.getElementById('cTip').style.display='none';
  // do NOT reset cards — keep whatever was last shown
});

  const f=e.target.files[0];if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    ratingHistory=parseRatingCSV(ev.target.result);
    chartData=ratingHistory;
    document.getElementById('s1').textContent=`✓ ${ratingHistory.length} 行`;
    document.getElementById('s1').className='fstat ok';
    if(ratingHistory.length){
      const first=ratingHistory[0],last=ratingHistory[ratingHistory.length-1];
      document.getElementById('pPtt').textContent='PTT '+last.rating.toFixed(2);
      document.getElementById('hRange').textContent=
        first.dateStr.split(' ')[0]+' ~ '+last.dateStr.split(' ')[0];
    }
    resizeCanvas();
  };
  r.readAsText(f);
});

document.getElementById('f2').addEventListener('change',function(e){

    showCurrentB30();
  };
  r.readAsText(f);
});

// ── songlist loader ───────────────────────────────
async function loadSonglist(){
  const paths=['./src/songs/songlist','./src/songs/songlist.json','./src/songlist','./src/songlist.json'];
  for(const path of paths){
    try{
      const res=await fetch(path);
      if(!res.ok) continue;
      const text=await res.text();
      const data=JSON.parse(text);
      songMap={};
      for(const s of data.songs||[]){
        songMap[s.id]=(s.title_localized?.en)||s.id;
      }
      console.log('[Songlist] loaded',Object.keys(songMap).length,'songs from',path);
      if(shownB30.length) renderCards(shownB30,shownDate);
      return;
    }catch(err){
      console.warn('[Songlist] failed at',path,err.message);
    }
  }
  console.error('[Songlist] all paths failed');
}
loadSonglist();
